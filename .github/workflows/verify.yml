name: Verify ReleaseGuard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Generate demonstration reports
        run: >-
          python -m releaseguard scan examples/benchmark
          --failures examples/failure-data.csv
          --model models/vulnerability_model.json
          --config config/releaseguard.json
          --output results/demo
          --no-fail-on-gate

